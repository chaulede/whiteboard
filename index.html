<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文网课互动白板 - 终极完全体</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.js"></script>
    <!-- 核心库引入 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.16/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        #whiteboardContent {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 3.5; 
            outline: none;
            word-break: break-word;
            padding-top: 20px;
        }

        ruby { ruby-align: center; margin: 0 4px; font-size: 1em; }
        rt {
            font-size: 0.8em !important; color: #1d4ed8 !important; 
            font-family: 'Arial', sans-serif !important; font-weight: bold !important; 
            margin-bottom: 2px; line-height: 1.1;
        }

        .english-line {
            display: block; font-size: 1.1em !important; color: #64748b;
            font-family: 'Arial', sans-serif; font-style: italic;
            border-left: 4px solid #cbd5e1; padding-left: 12px !important;
            margin: 15px 0 30px 0 !important; line-height: 1.4 !important;
        }

        .toolbar-btn {
            padding: 6px 10px; background-color: #f1f5f9; border: 1px solid #cbd5e1;
            border-radius: 6px; font-size: 13px; color: #334155; cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .toolbar-btn:hover { background-color: #e2e8f0; }

        .btn-draw-active { background-color: #3b82f6; color: white; border-color: #2563eb; }
        
        #drawToolbar {
            display: none; position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: white; padding: 8px 16px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100; align-items: center; gap: 12px; border: 1px solid #e2e8f0;
        }

        .color-btn { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-btn.active { border-color: #334155; transform: scale(1.15); }
        .color-btn:hover { transform: scale(1.15); }

        #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }
        #drawCanvas.active { pointer-events: auto; cursor: crosshair; }

        /* 加载动画 */
        .loader-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.9);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px;
            border-radius: 50%; border-left-color: #4f46e5; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6 overflow-hidden">
    <div class="flex flex-col md:flex-row h-[calc(100vh-3rem)] gap-6">
        
        <!-- 左侧：白板 -->
        <div class="flex-1 bg-white rounded-2xl shadow-lg flex flex-col border-4 border-blue-200 p-4 md:p-6 relative">
            
            <div id="drawToolbar">
                <span class="text-sm font-bold text-slate-600 mr-2">画笔颜色:</span>
                <div class="flex gap-2">
                    <div class="color-btn active" style="background-color: #ef4444;" onclick="setPenColor('#ef4444', this)"></div>
                    <div class="color-btn" style="background-color: #3b82f6;" onclick="setPenColor('#3b82f6', this)"></div>
                    <div class="color-btn" style="background-color: #eab308;" onclick="setPenColor('#eab308', this)"></div>
                    <div class="color-btn" style="background-color: #111;" onclick="setPenColor('#111', this)"></div>
                </div>
                <div class="w-px h-6 bg-slate-300 mx-2"></div>
                <button onclick="clearCanvas()" class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200 font-bold">🧹 清空笔迹</button>
                <button onclick="undoStroke()" class="text-xs bg-slate-100 text-slate-700 px-3 py-1 rounded hover:bg-slate-200 font-bold">↩️ 撤销笔迹</button>
            </div>

            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4 flex-wrap gap-2">
                <div class="flex items-center">
                    <span class="text-2xl mr-3">📝</span>
                    <h2 class="text-xl font-bold text-slate-800">中文互动白板</h2>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm text-slate-500">字号:</span>
                    <button id="btnAPlus" class="toolbar-btn font-bold" title="放大字号">A+</button>
                    <button id="btnAMinus" class="toolbar-btn font-bold" title="缩小字号">A-</button>
                    <span class="mx-1 text-slate-300">|</span>
                    <button id="btnBold" class="toolbar-btn font-bold" style="font-family: serif;" title="加粗">B</button>
                    <button id="btnRed" class="toolbar-btn text-red-500 font-bold" title="标红">A</button>
                    <span class="mx-1 text-slate-300">|</span>
                    <button id="btnDraw" class="toolbar-btn bg-slate-100 text-slate-700 border-slate-300 font-bold">
                        ✏️ 电子教鞭
                    </button>
                    <button id="btnAddPinyin" class="toolbar-btn bg-blue-100 text-blue-700 border-blue-300 font-bold">
                        ✨ 划选加拼音
                    </button>
                    <button id="btnTranslate" class="toolbar-btn bg-purple-100 text-purple-700 border-purple-300 font-bold">
                        🌐 划选加翻译
                    </button>
                    <button id="btnClear" class="toolbar-btn bg-red-50 text-red-700 border-red-200">🗑️ 清空</button>
                </div>
            </div>

            <div class="relative flex-1 overflow-hidden rounded-lg border border-slate-200 bg-white">
                <canvas id="drawCanvas"></canvas>
                
                <div id="loadingOverlay" class="loader-overlay hidden">
                    <div class="spinner"></div>
                    <p class="text-slate-700 font-bold text-lg">正在深度解析文档，请稍候...</p>
                    <p class="text-slate-400 text-xs mt-2">(如果是大文件，可能需要几秒钟)</p>
                </div>

                <div id="whiteboardContent" 
                     contenteditable="true" 
                     class="absolute inset-0 w-full h-full p-4 text-xl md:text-2xl text-slate-700 overflow-auto z-10"
                >
                    <p>欢迎使用！<br>1. 右侧上传 PDF/Word 自动解析提取文字。<br>2. 划选文字加拼音、翻译。<br>3. 一键生成复习笔记或测试卷。</p>
                </div>
            </div>
        </div>

        <!-- 右侧：控制面板 -->
        <div class="w-full md:w-80 bg-white rounded-2xl shadow p-5 flex flex-col space-y-4 border border-slate-200 overflow-y-auto">
            <div class="text-center">
                <h1 class="text-lg font-bold text-slate-800">📖 智能课堂助手</h1>
            </div>

            <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                <label class="block text-xs font-medium text-slate-700 mb-1">🔑 DeepSeek API Key (必填)</label>
                <input type="password" id="apiKey" placeholder="sk-..." class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">📌 学生级别</label>
                <select id="studentLevel" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="HSK 1">HSK 1</option>
                    <option value="HSK 2">HSK 2</option>
                    <option value="HSK 3" selected>HSK 3</option>
                    <option value="HSK 4">HSK 4</option>
                    <option value="HSK 5">HSK 5</option>
                    <option value="HSK 6">HSK 6</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">🎯 课程主题</label>
                <input type="text" id="courseTopic" placeholder="例如：在餐厅点菜" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                <label class="block text-xs font-medium text-slate-700 mb-1">📂 上传教学文档 (PDF/Word)</label>
                <div class="flex items-center gap-2">
                    <input type="file" id="documentFile" accept=".pdf,.docx,.doc,.txt" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 cursor-pointer">
                    <button id="btnClearFile" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 bg-red-50 rounded" title="删除上传的文件">✖</button>
                </div>
                <p id="fileNameDisplay" class="text-[10px] text-slate-500 mt-1 truncate"></p>
            </div>

            <!-- AI 功能区 -->
            <div class="flex flex-col gap-2.5 mt-auto pt-2">
                <button id="btnGenNotes" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition text-sm cursor-pointer flex justify-center items-center">
                    📚 一键整理白板笔记
                </button>
                <button id="btnDownloadNotes" class="hidden w-full bg-emerald-700 text-white py-1.5 rounded-lg text-xs hover:bg-emerald-800 transition cursor-pointer">
                    📥 下载复习笔记 (Word)
                </button>

                <button id="btnGenEx" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition text-sm cursor-pointer flex justify-center items-center mt-2 border-t border-slate-200 pt-3">
                    ✍️ 生成全套测试题
                </button>
                <button id="btnDownloadEx" class="hidden w-full bg-indigo-700 text-white py-1.5 rounded-lg text-xs hover:bg-indigo-800 transition cursor-pointer">
                    📥 下载测试题 (Word)
                </button>
            </div>
        </div>
    </div>

    <!-- 试卷 Modal -->
    <div id="examModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl flex flex-col">
            <div class="flex justify-between items-center p-5 border-b border-slate-200">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">📄 生成内容预览</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div id="examContent" class="p-6 overflow-y-auto flex-1 text-slate-700 whitespace-pre-wrap font-mono text-sm leading-relaxed bg-gray-50"></div>
            <div class="p-4 border-t flex justify-end gap-3 bg-white rounded-b-2xl">
                <button onclick="copyExam()" class="px-5 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 font-medium">📋 复制</button>
                <button id="modalDownloadBtn" class="px-5 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium">📥 下载 Word</button>
            </div>
        </div>
    </div>

    <script>
        // 指定 PDF.js 的云端 Worker 路径
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let exerciseContentText = "";
        let noteContentText = "";
        let extractedFileText = "";
        let currentMode = ""; 
        const whiteboard = document.getElementById('whiteboardContent');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // ================= 核心：文档解析引擎 =================
        document.getElementById('documentFile').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('fileNameDisplay').textContent = file.name;
            loadingOverlay.classList.remove('hidden'); 
            
            const fileName = file.name.toLowerCase();
            
            try {
                if (fileName.endsWith('.txt')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        extractedFileText = e.target.result;
                        whiteboard.innerHTML = `<p>${extractedFileText.replace(/\n/g, '</p><p>')}</p>`;
                        loadingOverlay.classList.add('hidden');
                    };
                    reader.readAsText(file, 'UTF-8');
                } 
                else if (fileName.endsWith('.docx') || fileName.endsWith('.doc')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        mammoth.extractRawText({ arrayBuffer: e.target.result }).then(result => {
                            extractedFileText = result.value;
                            whiteboard.innerHTML = `<p>${extractedFileText.replace(/\n/g, '</p><p>')}</p>`;
                            loadingOverlay.classList.add('hidden');
                        }).catch(err => {
                            alert("Word 解析失败：" + err.message);
                            loadingOverlay.classList.add('hidden');
                        });
                    };
                    reader.readAsArrayBuffer(file);
                } 
                else if (fileName.endsWith('.pdf')) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const typedarray = new Uint8Array(e.target.result);
                            const pdf = await pdfjsLib.getDocument(typedarray).promise;
                            let fullText = "";
                            
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                let pageText = "";
                                textContent.items.forEach(item => {
                                    pageText += item.str;
                                    if (item.hasEOL) pageText += "\n";
                                });
                                fullText += pageText + "\n";
                            }
                            
                            if (!fullText.trim()) {
                                alert("❌ 提取失败：该 PDF 可能是纯图片扫描版，里面没有真实文字。\n\n💡 解决办法：请用微信/QQ截图提取文字，或手动复制后粘贴到左侧白板。");
                                whiteboard.innerHTML = '<p>该PDF未提取到文本，请手动复制。</p>';
                            } else {
                                extractedFileText = fullText;
                                let cleanHtml = fullText
                                    .replace(/\n{3,}/g, '\n\n')
                                    .split('\n')
                                    .map(line => line.trim() ? `<p>${line}</p>` : '<br>')
                                    .join('');
                                whiteboard.innerHTML = cleanHtml;
                            }
                            loadingOverlay.classList.add('hidden');
                        } catch (err) {
                            alert("PDF 解析引擎崩溃：\n" + err.message);
                            loadingOverlay.classList.add('hidden');
                        }
                    };
                    reader.readAsArrayBuffer(file);
                }
            } catch (err) { 
                alert("系统文件读取错误：" + err.message); 
                loadingOverlay.classList.add('hidden');
            }
        });

        document.getElementById('btnClearFile').addEventListener('click', function() {
            document.getElementById('documentFile').value = "";
            document.getElementById('fileNameDisplay').textContent = "";
            extractedFileText = "";
        });

        // ================= 基础操作 =================
        let currentFontSize = 24;
        whiteboard.style.fontSize = currentFontSize + 'px';
        document.getElementById('btnAPlus').addEventListener('click', () => {
            currentFontSize = Math.min(80, currentFontSize + 2);
            whiteboard.style.fontSize = currentFontSize + 'px';
        });
        document.getElementById('btnAMinus').addEventListener('click', () => {
            currentFontSize = Math.max(14, currentFontSize - 2);
            whiteboard.style.fontSize = currentFontSize + 'px';
        });
        document.getElementById('btnBold').addEventListener('click', () => { document.execCommand('bold', false, null); });
        document.getElementById('btnRed').addEventListener('click', () => { document.execCommand('foreColor', false, '#ef4444'); });

        document.getElementById('btnAddPinyin').addEventListener('click', function() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            const selectedText = selection.toString().trim();
            if (!selectedText) { alert('请先用鼠标选中需要加拼音的汉字！'); return; }

            const fragment = document.createDocumentFragment();
            for (let char of selectedText) {
                if (/[\u4e00-\u9fa5]/.test(char)) {
                    let py = window.pinyinPro.pinyin(char, { toneType: 'symbol' });
                    const ruby = document.createElement('ruby');
                    ruby.textContent = char;
                    const rt = document.createElement('rt');
                    rt.textContent = py;
                    ruby.appendChild(rt);
                    fragment.appendChild(ruby);
                    fragment.appendChild(document.createTextNode('\u200B'));
                } else {
                    fragment.appendChild(document.createTextNode(char === ' ' ? '\u00A0' : char));
                }
            }
            range.deleteContents();
            range.insertNode(fragment);
            selection.removeAllRanges();
        });

        // ================= 划选加翻译 =================
        document.getElementById('btnTranslate').addEventListener('click', async function() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            const selectedText = selection.toString().trim();
            if (!selectedText) { alert('请先用鼠标选中需要翻译的汉字！'); return; }

            const btn = this;
            btn.innerHTML = "🌐 翻译中...";
            btn.disabled = true;

            let translation = "";
            const apiKey = document.getElementById('apiKey').value.trim();

            try {
                if (apiKey) {
                    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "deepseek-chat",
                            messages: [{ role: "system", content: "Translate Chinese to English. ONLY output the English translation." }, { role: "user", content: selectedText }],
                            temperature: 0.1
                        })
                    });
                    const data = await res.json();
                    translation = data.choices[0].message.content.trim();
                } else {
                    const res = await fetch(`https://api.vvhan.com/api/fy?text=${encodeURIComponent(selectedText)}`);
                    const data = await res.json();
                    if (data.success && data.data) translation = data.data.en;
                }
            } catch (e) { translation = "(翻译失败)"; }

            btn.innerHTML = "🌐 划选加翻译";
            btn.disabled = false;

            const engLine = document.createElement('div');
            engLine.className = 'english-line';
            engLine.textContent = translation;

            range.collapse(false);
            const br = document.createElement('br');
            range.insertNode(br);
            range.insertNode(engLine);
            engLine.after(document.createElement('br'));
            selection.removeAllRanges();
        });

        // ================= 一键整理笔记 =================
        document.getElementById('btnGenNotes').addEventListener('click', async function() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const level = document.getElementById('studentLevel').value;
            const whiteboardText = whiteboard.innerText.trim();
            let sourceText = whiteboardText.length > 10 ? whiteboardText : extractedFileText;
            
            if (!apiKey) { alert('生成笔记必须填入 DeepSeek API Key！'); return; }
            if (!sourceText) { alert('白板和上传文档中都没有内容！'); return; }

            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="loader"></span> 正在提炼笔记...`;
            btn.disabled = true;

            let prompt = `你是一位拥有10年经验的国际中文教师。请根据我提供的白板语料，提取出结构化复习笔记。
【严格要求】
1. 不要照抄原文，请进行分类汇总。
2. 必须包含四个板块：【核心词汇】（带拼音和词性）、【重点语法】、【典型例句】（中英对照）、【课后练习】（出2道小题）。
3. 语言要精炼，排版要像印刷出来的讲义一样清晰。
【白板语料】\n${sourceText}`;

            try {
                const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
                });
                const data = await res.json();
                noteContentText = data.choices[0].message.content;
                currentMode = 'note';
                
                document.getElementById('modalTitle').innerText = "📚 复习笔记整理完毕";
                document.getElementById('examContent').innerText = noteContentText;
                document.getElementById('examModal').classList.remove('hidden');
                document.getElementById('btnDownloadNotes').classList.remove('hidden');
            } catch (e) { alert("整理失败：" + e.message); }
            finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // ================= 生成测试题 =================
        document.getElementById('btnGenEx').addEventListener('click', async function() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const level = document.getElementById('studentLevel').value;
            const topic = document.getElementById('courseTopic').value.trim() || '综合应用';
            const whiteboardText = whiteboard.innerText.trim();
            
            let sourceText = whiteboardText.length > 10 ? whiteboardText : extractedFileText;
            if (!sourceText) { alert('无内容可出题！'); return; }
            if (!apiKey) { alert('必须填入 DeepSeek API Key！'); return; }

            const btn = this;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="loader"></span> AI 正在出题...`;
            btn.disabled = true;

            let pinyinRule = (level === "HSK 1" || level === "HSK 2") ? "【重要】所有句子和选项必须标出拼音！格式为：第一行拼音，第二行汉字。" : "";

            let prompt = `你是一个极度严格的 ${level} 命题专家。生成一套关于“${topic}”的测试题。
${pinyinRule}
【要求】包含听力、阅读、书写三大板块，附带答案与解析。无法显示图片请用【图：描述】代替。
【语料】\n${sourceText}`;

            try {
                const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
                });
                const data = await res.json();
                exerciseContentText = data.choices[0].message.content;
                currentMode = 'exam';
                
                document.getElementById('modalTitle').innerText = "📄 AI 生成的测试题";
                document.getElementById('examContent').innerText = exerciseContentText;
                document.getElementById('examModal').classList.remove('hidden');
                document.getElementById('btnDownloadEx').classList.remove('hidden');
            } catch (e) { alert("出题失败：" + e.message); }
            finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // 弹窗统一控制与下载
        document.getElementById('modalDownloadBtn').addEventListener('click', function() {
            const textToDownload = currentMode === 'note' ? noteContentText : exerciseContentText;
            const fileName = currentMode === 'note' ? '复习笔记' : '测试题';
            const blob = new Blob(['\ufeff' + textToDownload], { type: 'application/msword' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${fileName}_${document.getElementById('studentLevel').value}.doc`;
            a.click();
        });

        function closeModal() { document.getElementById('examModal').classList.add('hidden'); }
        function copyExam() { 
            const text = document.getElementById('examContent').innerText;
            navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板！')); 
        }

        // 画笔简写
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, isDrawMode = false, penColor = '#ef4444', strokes = [];
        document.getElementById('btnDraw').addEventListener('click', function() {
            isDrawMode = !isDrawMode;
            this.classList.toggle('btn-draw-active');
            canvas.classList.toggle('active');
            document.getElementById('drawToolbar').style.display = isDrawMode ? 'flex' : 'none';
            whiteboard.style.pointerEvents = isDrawMode ? 'none' : 'auto';
            if(isDrawMode) {
                canvas.width = canvas.parentElement.offsetWidth;
                canvas.height = canvas.parentElement.offsetHeight;
            }
        });
        function setPenColor(c, el) { penColor = c; document.querySelectorAll('.color-btn').forEach(e=>e.classList.remove('active')); el.classList.add('active'); }
        canvas.addEventListener('mousedown', e => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            strokes.push({ color: penColor, points: [{x: e.clientX - rect.left, y: e.clientY - rect.top}] });
        });
        canvas.addEventListener('mousemove', e => {
            if(!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.strokeStyle = penColor; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke();
            strokes[strokes.length - 1].points.push({x: e.clientX - rect.left, y: e.clientY - rect.top});
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes.forEach(s => {
                ctx.beginPath(); ctx.strokeStyle = s.color; ctx.lineWidth = 4;
                if(s.points.length > 0) {
                    ctx.moveTo(s.points[0].x, s.points[0].y);
                    s.points.forEach(p => ctx.lineTo(p.x, p.y));
                    ctx.stroke();
                }
            });
        }
        function clearCanvas() { strokes = []; redraw(); }
        function undoStroke() { strokes.pop(); redraw(); }

        document.getElementById('btnClear').addEventListener('click', function() {
            if(confirm("确定清空白板文字？")) {
                whiteboard.innerHTML = '<p><br></p>';
            }
        });
    </script>
</body>
</html>
